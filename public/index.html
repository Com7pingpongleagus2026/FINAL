<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spyfall Online 🕵️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="container">
    <div class="logo">🕵️</div>
    <h1 class="title">SPYFALL</h1>
    <p class="subtitle">ใครคือสายลับ?</p>
    <button class="btn btn-primary" onclick="showScreen('screen-create')">🏠 สร้างห้อง</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-join')">🚪 เข้าร่วมห้อง</button>
    <button class="btn btn-ghost" onclick="showAdminLogin()">⚙️ จัดการสถานที่</button>
  </div>
</div>

<!-- CREATE ROOM -->
<div id="screen-create" class="screen">
  <div class="container">
    <h2>🏠 สร้างห้อง</h2>
    <input type="text" id="create-name" class="input" placeholder="ชื่อของคุณ" maxlength="12">
    <button class="btn btn-primary" onclick="createRoom()">สร้างห้อง</button>
    <button class="btn btn-ghost" onclick="showScreen('screen-home')">← กลับ</button>
  </div>
</div>

<!-- JOIN ROOM -->
<div id="screen-join" class="screen">
  <div class="container">
    <h2>🚪 เข้าร่วมห้อง</h2>
    <input type="text" id="join-name" class="input" placeholder="ชื่อของคุณ" maxlength="12">
    <input type="text" id="join-code" class="input" placeholder="รหัสห้อง (4 ตัว)" maxlength="4" style="text-transform:uppercase">
    <button class="btn btn-primary" onclick="joinRoom()">เข้าร่วม</button>
    <button class="btn btn-ghost" onclick="showScreen('screen-home')">← กลับ</button>
  </div>
</div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen">
  <div class="container">
    <h2>📋 ห้องรอ</h2>
    <div class="room-code-display">รหัสห้อง: <span id="lobby-code">----</span></div>
    <div class="settings-panel" id="settings-panel">
      <label>⏱️ เวลา:
        <select id="timer-select" onchange="updateSettings()">
          <option value="300">5 นาที</option>
          <option value="480" selected>8 นาที</option>
          <option value="600">10 นาที</option>
        </select>
      </label>
      <label>🎮 โหมด:
        <select id="mode-select" onchange="updateSettings()">
          <option value="normal">ปกติ</option>
          <option value="hard">ยาก (4 นาที)</option>
        </select>
      </label>
    </div>
    <div id="player-list" class="player-list"></div>
    <button class="btn btn-primary" id="btn-start" style="display:none" onclick="startGame()">🚀 เริ่มเกม</button>
    <p class="hint" id="lobby-hint">รอผู้เล่นอย่างน้อย 3 คน...</p>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="container">
    <div class="timer-bar"><span id="timer-text">8:00</span></div>
    <div class="card-container" onclick="toggleCard()">
      <div class="card" id="game-card">
        <div class="card-front">
          <p>แตะเพื่อดูการ์ด</p>
          <div class="card-icon">🃏</div>
        </div>
        <div class="card-back">
          <div id="card-role-label" class="role-label"></div>
          <div id="card-location" class="card-location"></div>
          <div id="card-role" class="card-role"></div>
        </div>
      </div>
    </div>
    <div id="game-players" class="game-players"></div>
    <div class="game-actions">
      <button class="btn btn-danger" onclick="callVote()">🗳️ เรียกโหวต</button>
      <button class="btn btn-warning" id="btn-spy-guess" style="display:none" onclick="showSpyGuess()">🎯 ทายสถานที่</button>
    </div>
  </div>
</div>

<!-- VOTE -->
<div id="screen-vote" class="screen">
  <div class="container">
    <h2>🗳️ โหวตสายลับ</h2>
    <p class="hint">เลือกคนที่คุณคิดว่าเป็นสายลับ</p>
    <div id="vote-players" class="vote-players"></div>
    <div id="vote-status" class="vote-status"></div>
  </div>
</div>

<!-- SPY GUESS -->
<div id="screen-spy-guess" class="screen">
  <div class="container">
    <h2>🎯 ทายสถานที่</h2>
    <p class="hint">คุณคือสายลับ! เลือกสถานที่ที่คุณคิดว่าถูก</p>
    <div id="spy-locations" class="spy-locations"></div>
  </div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <div class="container">
    <h2 id="result-title">🎉 ผลลัพธ์</h2>
    <div id="result-content" class="result-content"></div>
    <button class="btn btn-primary" id="btn-play-again" style="display:none" onclick="playAgain()">🔄 เล่นอีกรอบ</button>
    <button class="btn btn-ghost" onclick="leaveRoom()">🚪 ออกจากห้อง</button>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="screen-admin-login" class="screen">
  <div class="container">
    <h2>🔒 เข้าสู่ระบบ Admin</h2>
    <input type="password" id="admin-pass" class="input" placeholder="รหัสผ่าน">
    <button class="btn btn-primary" onclick="adminLogin()">เข้าสู่ระบบ</button>
    <button class="btn btn-ghost" onclick="showScreen('screen-home')">← กลับ</button>
  </div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div class="container">
    <h2>⚙️ จัดการสถานที่</h2>
    <div id="admin-locations" class="admin-locations"></div>
    <button class="btn btn-ghost" onclick="showScreen('screen-home')">← กลับหน้าหลัก</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
