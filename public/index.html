<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f1a">
  <title>Spyfall Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="container home-container">
      <div class="logo">
        <div class="logo-icon">🕵️</div>
        <h1>SPYFALL</h1>
        <p class="subtitle">หาสายลับให้เจอ!</p>
      </div>
      <div class="home-buttons">
        <button class="btn btn-primary btn-large" onclick="showScreen('screen-create')">🎮 สร้างห้อง</button>
        <button class="btn btn-secondary btn-large" onclick="showScreen('screen-join')">🚪 เข้าร่วมห้อง</button>
        <button class="btn btn-ghost" onclick="showAdminLogin()">⚙️ Admin</button>
      </div>
    </div>
  </div>

  <!-- CREATE -->
  <div id="screen-create" class="screen">
    <div class="container">
      <button class="btn-back" onclick="showScreen('screen-home')">← กลับ</button>
      <h2>สร้างห้อง</h2>
      <div class="form-group">
        <label>ชื่อของคุณ</label>
        <input type="text" id="create-name" placeholder="ใส่ชื่อ..." maxlength="12" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-large" onclick="createRoom()">✨ สร้างห้อง</button>
    </div>
  </div>

  <!-- JOIN -->
  <div id="screen-join" class="screen">
    <div class="container">
      <button class="btn-back" onclick="showScreen('screen-home')">← กลับ</button>
      <h2>เข้าร่วมห้อง</h2>
      <div class="form-group">
        <label>ชื่อของคุณ</label>
        <input type="text" id="join-name" placeholder="ใส่ชื่อ..." maxlength="12" autocomplete="off">
      </div>
      <div class="form-group">
        <label>รหัสห้อง</label>
        <input type="text" id="join-code" placeholder="เช่น A7K2" maxlength="4" autocomplete="off" style="text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:1.5rem">
      </div>
      <button class="btn btn-primary btn-large" onclick="joinRoom()">🚀 เข้าร่วม</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <div class="container">
      <h2>📋 ห้องรอ</h2>
      <div class="room-code-box" onclick="copyCode()">
        <span class="room-code-label">รหัสห้อง (แตะเพื่อคัดลอก)</span>
        <span class="room-code" id="lobby-code">----</span>
      </div>
      <div class="settings-panel" id="settings-panel" style="display:none">
        <label>⏱️ เวลา:
          <select id="timer-select" onchange="updateSettings()">
            <option value="180">3 นาที</option>
            <option value="300">5 นาที</option>
            <option value="480" selected>8 นาที</option>
            <option value="600">10 นาที</option>
          </select>
        </label>
      </div>
      <div id="player-list" class="player-list"></div>
      <div id="lobby-actions">
        <button class="btn btn-primary btn-large" id="btn-start" style="display:none" onclick="startGame()">🚀 เริ่มเกม!</button>
        <p class="hint" id="lobby-hint">รอผู้เล่นอย่างน้อย 3 คน...</p>
        <button class="btn btn-ghost" onclick="leaveRoom()">🚪 ออกจากห้อง</button>
      </div>
    </div>
  </div>

  <!-- GAME (Card + Timer) -->
  <div id="screen-game" class="screen">
    <div class="container game-container">
      <!-- Card Phase -->
      <div id="card-phase">
        <h2 id="card-phase-title">แตะการ์ดเพื่อดู</h2>
        <div class="card-wrapper" onclick="flipCard()">
          <div class="game-card" id="game-card">
            <div class="card-face card-front">
              <div class="card-front-icon">🃏</div>
              <p>แตะเพื่อเปิด</p>
            </div>
            <div class="card-face card-back" id="card-back">
              <div id="card-content"></div>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" id="btn-ready" style="display:none" onclick="cardReady()">✅ พร้อมแล้ว!</button>
      </div>

      <!-- Play Phase (Timer) -->
      <div id="play-phase" style="display:none">
        <div class="timer-circle-container">
          <svg class="timer-svg" viewBox="0 0 200 200">
            <circle class="timer-bg" cx="100" cy="100" r="90"/>
            <circle class="timer-progress" id="timer-progress" cx="100" cy="100" r="90"/>
          </svg>
          <div class="timer-text" id="timer-text">8:00</div>
        </div>
        <p class="talk-message">🗣️ เงยหน้าคุยกัน!<br><span class="talk-sub">ถาม-ตอบเพื่อหาสายลับ</span></p>
        <div class="play-actions">
          <button class="btn btn-small" onclick="peekCard()">👁️ ดูการ์ด</button>
          <button class="btn btn-small" onclick="showLocations()">📍 สถานที่ทั้งหมด</button>
          <button class="btn btn-small" onclick="randomQuestion()">🎲 สุ่มคำถาม</button>
        </div>
        <div id="host-game-actions" style="display:none">
          <button class="btn btn-danger btn-large" onclick="endRound()">⏹️ จบรอบ — เฉลย!</button>
          <button class="btn btn-ghost btn-small" onclick="backToLobby()">⬅️ กลับ Lobby</button>
        </div>
      </div>
    </div>
  </div>

  <!-- REVEAL -->
  <div id="screen-reveal" class="screen">
    <div class="container">
      <h2>🎭 เฉลย!</h2>
      <div class="reveal-box" id="reveal-content"></div>
      <div id="reveal-actions" style="display:none">
        <button class="btn btn-primary btn-large" onclick="playAgain()">🔄 เล่นอีกรอบ</button>
        <button class="btn btn-ghost" onclick="leaveRoom()">🚪 ออกจากห้อง</button>
      </div>
    </div>
  </div>

  <!-- LOCATIONS MODAL -->
  <div id="modal-locations" class="modal" style="display:none" onclick="closeModal(event)">
    <div class="modal-content">
      <h3>📍 สถานที่ทั้งหมด</h3>
      <div id="locations-grid" class="locations-grid"></div>
      <button class="btn btn-ghost" onclick="document.getElementById('modal-locations').style.display='none'">ปิด</button>
    </div>
  </div>

  <!-- PEEK CARD MODAL -->
  <div id="modal-peek" class="modal" style="display:none" onclick="closePeek(event)">
    <div class="modal-content peek-content" id="peek-content"></div>
  </div>

  <!-- QUESTION TOAST -->
  <div id="question-card" class="question-card" style="display:none">
    <div class="question-text" id="question-text"></div>
  </div>

  <!-- ADMIN LOGIN -->
  <div id="screen-admin-login" class="screen">
    <div class="container">
      <button class="btn-back" onclick="showScreen('screen-home')">← กลับ</button>
      <h2>🔐 Admin</h2>
      <div class="form-group">
        <input type="password" id="admin-pass" placeholder="รหัสผ่าน">
      </div>
      <button class="btn btn-primary" onclick="adminLogin()">เข้าสู่ระบบ</button>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="screen-admin" class="screen">
    <div class="container">
      <button class="btn-back" onclick="showScreen('screen-home')">← กลับ</button>
      <h2>⚙️ จัดการสถานที่</h2>
      <div id="admin-locations" class="admin-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
